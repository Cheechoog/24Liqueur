version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Licor Marketplace 24/7 – Docker Compose
# Stack: Spring Boot 3 | PostgreSQL 15 | RabbitMQ 3
# Arrancar: docker-compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── BASES DE DATOS (una por microservicio) ───────────────────────────────
  db-usuarios:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: usuarios_db, POSTGRES_USER: admin, POSTGRES_PASSWORD: secret }
    ports: ["5432:5432"]
    volumes: [db_usuarios:/var/lib/postgresql/data]
    networks: [licor-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d usuarios_db"]
      interval: 10s
      retries: 5

  db-catalogo:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: catalogo_db, POSTGRES_USER: admin, POSTGRES_PASSWORD: secret }
    ports: ["5433:5432"]
    volumes: [db_catalogo:/var/lib/postgresql/data]
    networks: [licor-net]

  db-pedidos:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: pedidos_db, POSTGRES_USER: admin, POSTGRES_PASSWORD: secret }
    ports: ["5434:5432"]
    volumes: [db_pedidos:/var/lib/postgresql/data]
    networks: [licor-net]

  db-pagos:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: pagos_db, POSTGRES_USER: admin, POSTGRES_PASSWORD: secret }
    ports: ["5435:5432"]
    volumes: [db_pagos:/var/lib/postgresql/data]
    networks: [licor-net]

  db-inventario:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: inventario_db, POSTGRES_USER: admin, POSTGRES_PASSWORD: secret }
    ports: ["5436:5432"]
    volumes: [db_inventario:/var/lib/postgresql/data]
    networks: [licor-net]

  db-tiendas:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: tiendas_db, POSTGRES_USER: admin, POSTGRES_PASSWORD: secret }
    ports: ["5437:5432"]
    volumes: [db_tiendas:/var/lib/postgresql/data]
    networks: [licor-net]

  db-envios:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: envios_db, POSTGRES_USER: admin, POSTGRES_PASSWORD: secret }
    ports: ["5438:5432"]
    volumes: [db_envios:/var/lib/postgresql/data]
    networks: [licor-net]

  db-notificaciones:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: notificaciones_db, POSTGRES_USER: admin, POSTGRES_PASSWORD: secret }
    ports: ["5439:5432"]
    volumes: [db_notificaciones:/var/lib/postgresql/data]
    networks: [licor-net]

  # ── MESSAGE BROKER ───────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # UI → http://localhost:15672  (guest / guest)
    networks: [licor-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 5

  # ── MICROSERVICIOS ───────────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on: [usuarios-service, catalogo-service, pedidos-service, pagos-service,
                 inventario-service, tiendas-service, envios-service, notificaciones-service]
    networks: [licor-net]

  usuarios-service:
    build: ./usuarios-service
    ports: ["8081:8081"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-usuarios:5432/usuarios_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_RABBITMQ_HOST: rabbitmq
      JWT_SECRET: "super_secret_key_change_in_production_min32chars"
    depends_on: [db-usuarios, rabbitmq]
    networks: [licor-net]

  catalogo-service:
    build: ./catalogo-service
    ports: ["8082:8082"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-catalogo:5432/catalogo_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on: [db-catalogo, rabbitmq]
    networks: [licor-net]

  pedidos-service:
    build: ./pedidos-service
    ports: ["8083:8083"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-pedidos:5432/pedidos_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on: [db-pedidos, rabbitmq]
    networks: [licor-net]

  pagos-service:
    build: ./pagos-service
    ports: ["8084:8084"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-pagos:5432/pagos_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on: [db-pagos, rabbitmq]
    networks: [licor-net]

  inventario-service:
    build: ./inventario-service
    ports: ["8085:8085"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-inventario:5432/inventario_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on: [db-inventario, rabbitmq]
    networks: [licor-net]

  tiendas-service:
    build: ./tiendas-service
    ports: ["8086:8086"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-tiendas:5432/tiendas_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on: [db-tiendas, rabbitmq]
    networks: [licor-net]

  envios-service:
    build: ./envios-service
    ports: ["8087:8087"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-envios:5432/envios_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on: [db-envios, rabbitmq]
    networks: [licor-net]

  notificaciones-service:
    build: ./notificaciones-service
    ports: ["8088:8088"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-notificaciones:5432/notificaciones_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on: [db-notificaciones, rabbitmq]
    networks: [licor-net]

volumes:
  db_usuarios: db_catalogo: db_pedidos: db_pagos:
  db_inventario: db_tiendas: db_envios: db_notificaciones:

networks:
  licor-net:
    driver: bridge
